# Blueprint de Render. Si conectás el repo con "Blueprint", Render lee esto y
# crea el servicio solo. También podés crear un "Web Service" a mano y usar el
# mismo Start Command de abajo.
services:
  - type: web
    name: cerebro-shoppingasia
    runtime: python
    plan: starter            # ~US$7/mes, siempre prendido (no se duerme)
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      # Python fijado: 3.13 (el default nuevo de Render) no tiene ruedas para
      # numpy 1.26 / onnxruntime 1.19 y el build falla en silencio.
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Los VALORES se cargan en el panel de Render (Environment), NO acá.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KOMMO_SUBDOMAIN
        sync: false
      - key: KOMMO_TOKEN
        sync: false
      - key: KOMMO_SECRET_KEY
        sync: false
      - key: CATEGORIAS_INDEX
        value: "7"
